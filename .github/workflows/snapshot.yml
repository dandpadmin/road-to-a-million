# Copy to .github/workflows/snapshot.yml in the repository.
# Assumes this folder (odometer) IS the repository root.
# This is the timer: every 15 minutes it runs the helper and commits odometer.json.
name: Odometer snapshot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull and shape the feed
        env:
          TESSIE_TOKEN: ${{ secrets.TESSIE_TOKEN }}
          TESSIE_VIN: ${{ secrets.TESSIE_VIN }}
          EMBARGO_HOURS: ${{ vars.EMBARGO_HOURS }}
          OUT: odometer.json
        run: node job/fetch-snapshot.mjs
      - name: Pull Ron's Instagram posts
        if: ${{ vars.IG_USER_ID != '' }}
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_OUT: instagram.json
        run: node job/fetch-instagram.mjs
      - name: Commit if changed
        run: |
          git config user.name "odometer-bot"
          git config user.email "odometer-bot@users.noreply.github.com"
          git add odometer.json instagram.json 2>/dev/null || git add odometer.json
          git diff --staged --quiet || git commit -m "odometer snapshot"
          git push
