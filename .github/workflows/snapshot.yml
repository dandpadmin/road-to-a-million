# The timer: every 2 hours it runs the helper and commits odometer.json.
# Minute 17 avoids the top of the hour, when GitHub's scheduler is busiest and
# most likely to delay or skip a run. GitHub still treats schedules as
# best-effort, so expect roughly 8-12 runs a day rather than exactly 12.
# Every run is a commit and a site rebuild, so keep the interval modest.
name: Odometer snapshot
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
# Two runs committing the same file at once is a guaranteed rejected push.
concurrency:
  group: odometer-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    # Off switch: set the repository variable SNAPSHOT_PAUSED to true
    # (Settings > Secrets and variables > Actions > Variables) and every run,
    # scheduled or manual, is skipped before anything talks to Tessie.
    if: ${{ vars.SNAPSHOT_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read-only check (no wake or command calls)
        run: node job/check-readonly.mjs
      - name: Check the credentials exist before calling anything
        env:
          TESSIE_TOKEN: ${{ secrets.TESSIE_TOKEN }}
          TESSIE_VIN: ${{ secrets.TESSIE_VIN }}
        run: |
          [ -n "$TESSIE_TOKEN" ] || { echo "::error::TESSIE_TOKEN secret is empty or missing"; exit 1; }
          [ -n "$TESSIE_VIN" ]   || { echo "::error::TESSIE_VIN secret is empty or missing"; exit 1; }
      - name: Pull and shape the feed
        env:
          TESSIE_TOKEN: ${{ secrets.TESSIE_TOKEN }}
          TESSIE_VIN: ${{ secrets.TESSIE_VIN }}
          EMBARGO_HOURS: ${{ vars.EMBARGO_HOURS }}
          OUT: odometer.json
          HISTORY: history.json
        run: node job/fetch-snapshot.mjs
      # A human push lands between the checkout and the push often enough that a
      # bare `git push` fails on its own schedule. Rebase and retry instead.
      - name: Commit if changed
        run: |
          git config user.name "odometer-bot"
          git config user.email "odometer-bot@users.noreply.github.com"
          git add odometer.json history.json archive ledger route.json
          if git diff --staged --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "odometer snapshot"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $i failed — retrying"
            sleep $((i * 5))
          done
          echo "::error::could not push the snapshot after 3 attempts"
          exit 1
